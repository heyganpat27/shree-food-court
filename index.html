<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shree Food Court | Order</title>
<style>
:root{--b:#a8402a;--s:#f2a33a;--p:#fbf3e4;--c:#fff9ee;--i:#2b1a14;--m:#6e5a4e;--l:#e6d5bb;--g:#2e7d3e}
@media(prefers-color-scheme:dark){:root{--b:#d9654a;--p:#1d1511;--c:#271c16;--i:#f6e9d6;--m:#bfa890;--l:#3d2d24;--g:#5fc272}}
*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--i);font:17px/1.5 system-ui,"Noto Sans Devanagari",sans-serif;padding-bottom:96px}
header{background:var(--b);color:#fff8ec;padding:18px 16px}header h1{margin:0;font-size:24px}header span{opacity:.9}
.w{max-width:640px;margin:0 auto;padding:0 16px}
h2{color:var(--b);border-bottom:2px solid var(--b);margin:24px 0 4px;font-size:21px}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--l)}
.it .n{flex:1}.it b{font-weight:600;display:block}.it small{color:var(--m)}
.st{display:flex;align-items:center;gap:8px}
button{font:inherit;cursor:pointer}
.st button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--b);background:var(--c);color:var(--b);font-size:22px}
.st .q{min-width:20px;text-align:center;font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--p);border-top:1px solid var(--l);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:none}
.bar .in{max-width:640px;margin:auto;display:grid;gap:8px}
.bar input{height:44px;border-radius:10px;border:1.5px solid var(--l);background:var(--c);color:var(--i);padding:0 12px;font:inherit}
.go{height:50px;border-radius:999px;border:0;background:var(--b);color:#fff8ec;font-weight:700}
.go:disabled{opacity:.5}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:16px;margin:16px 0}
.stat{font-size:26px;font-weight:800;color:var(--b)}
.red{background:transparent;border:2px solid #c0392b;color:#c0392b;border-radius:999px;height:48px;width:100%;font-weight:700;margin-top:12px}
#status{display:none}
</style></head><body>
<header><div class="w"><h1>Shree Food Court</h1><span id="tl"></span></div></header>
<div class="w" id="menu"></div>
<div class="w" id="status"></div>
<div class="bar" id="bar"><div class="in">
<input id="tb" placeholder="Table number" inputmode="numeric" style="display:none">
<input id="nm" placeholder="Aapka naam (optional)">
<button class="go" id="go"></button>
<small style="color:var(--m);text-align:center">Payment counter par hogi</small></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,addDoc,doc,onSnapshot,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyBtYx-6fekDgiXfZyfuQ7DnA9oZl45vA64",authDomain:"shree-food-court-be6ee.firebaseapp.com",projectId:"shree-food-court-be6ee",storageBucket:"shree-food-court-be6ee.firebasestorage.app",messagingSenderId:"615731534787",appId:"1:615731534787:web:b67bd5962dba2e6ebafb76"});
const auth=getAuth(app),db=getFirestore(app),$=s=>document.querySelector(s);
const MENU=[
["Sandwich",[["वेज ग्रील सेण्डविच","Veg Grill",59],["चीज ग्रील सेण्डविच","Cheese Grill",69],["वेज कॉर्न ग्रील सेण्डविच","Veg Corn Grill",79],["पनीर टिक्का ग्रील सेण्डविच","Paneer Tikka Grill",89],["पनीर कॉर्न ग्रील सेण्डविच","Paneer Corn Grill",99],["पनीर चीज ग्रील सेण्डविच","Paneer Cheese Grill",99]]],
["Pizza",[["ओनियन कैप्सिकम पिज्जा","Onion Capsicum",129,179],["मिक्स वेज पिज्जा","Mix Veg",139,189],["चीज गार्लिक पिज्जा","Cheese Garlic",139,189],["मार्गेरिटा पिज्जा","Margherita",139,189],["पनीर कॉर्न पिज्जा","Paneer Corn",149,199],["चीज पनीर पिज्जा","Cheese Paneer",159,209],["पनीर तंदुरी पिज्जा","Paneer Tandoori",169,229],["श्री FC स्पेशल पिज्जा","Shree FC Special",179,249]]],
["Momos",[["स्टीम मोमोज","Steam",70],["फ्राई मोमोज","Fried",80],["कुरकुरे मोमोज","Crunchy",100]]],
["Pasta",[["प्लेन पास्ता","Plain",70],["रेड सॉस पास्ता","Red Sauce",90],["वाईट सॉस पास्ता","White Sauce",100]]],
["Starter",[["क्रिस्पी पोटेटो","Crispy Potato",119],["सिजनोन चिल्ली पोटेटो","Schezwan Chilli Potato",129],["हनी चिल्ली पोटेटो","Honey Chilli Potato",129],["ड्रेगन पोटेटो","Dragon Potato",139],["कॉर्न फिटर","Corn Fritter",139]]],
["Manchurian",[["मन्च्युरियन ग्रेवी","Manchurian Gravy",89],["मन्च्युरियन ड्राई","Manchurian Dry",89],["पनीर मन्च्युरियन ड्राई","Paneer Manchurian Dry",109],["पनीर मन्च्युरियन ग्रेवी","Paneer Manchurian Gravy",109]]],
["Paneer",[["पनीर चिल्ली ग्रेवी","Paneer Chilli Gravy",150],["पनीर 65","Paneer 65",150],["पनीर चिल्ली ड्राई","Paneer Chilli Dry",160],["पनीर फिटर","Paneer Fritter",160],["ड्रेगन पनीर","Dragon Paneer",170]]],
["Burger",[["वेज बर्गर","Veg Burger",69],["वेज चीज बर्गर","Veg Cheese Burger",79],["पनीर बर्गर","Paneer Burger",89],["श्री FC स्पेशल बर्गर","Shree FC Special",109]]]];
const items=[],cart={};
MENU.forEach(([c,l])=>l.forEach(x=>{if(x[3]){items.push({c,h:x[0],e:x[1]+" (S)",p:x[2]},{c,h:x[0],e:x[1]+" (L)",p:x[3]})}else items.push({c,h:x[0],e:x[1],p:x[2]})}));
const table=new URLSearchParams(location.search).get("table")||"";
$("#tl").textContent=table?"Table "+table:"Welcome";
if(!table)$("#tb").style.display="block";
let h="",last="",i=0;
for(const x of items){if(x.c!==last){h+="<h2>"+x.c+"</h2>";last=x.c}
h+='<div class="it"><div class="n"><b>'+x.h+'</b><small>'+x.e+' · ₹'+x.p+'</small></div><div class="st"><button data-i="'+i+'" data-a="-" aria-label="Kam karo">−</button><span class="q" id="q'+i+'">0</span><button data-i="'+i+'" data-a="+" aria-label="Add karo">+</button></div></div>';i++}
$("#menu").innerHTML=h;
function sum(){let n=0,t=0;for(const k in cart){n+=cart[k];t+=cart[k]*items[k].p}return[n,t]}
$("#menu").onclick=e=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset.i,d=b.dataset.a==="+"?1:-1;
cart[k]=Math.max(0,(cart[k]||0)+d);if(!cart[k])delete cart[k];$("#q"+k).textContent=cart[k]||0;
const[n,t]=sum();$("#bar").style.display=n?"block":"none";$("#go").textContent="Place order · "+n+" items · ₹"+t};
$("#go").onclick=async()=>{
const t=table||$("#tb").value.trim();if(!t){alert("Table number likho");return}
const lines=Object.keys(cart).map(k=>({n:items[k].c+" - "+items[k].e,q:cart[k],p:items[k].p})),total=sum()[1];
$("#go").disabled=true;
try{await signInAnonymously(auth);
const r=await addDoc(collection(db,"orders"),{uid:auth.currentUser.uid,table:t,name:$("#nm").value.trim(),items:lines,total,status:"new",createdAt:serverTimestamp()});
localStorage.setItem("oid",r.id);track(r.id)}
catch(e){console.error(e);alert("Order nahi gaya. Internet check karke dubara try karo.");$("#go").disabled=false}};
const MSG={new:["Order bhej diya","Kitchen ke accept karne ka wait karo. Abhi cancel kar sakte ho."],cooking:["Ban raha hai","Aapka order taiyaar ho raha hai."],ready:["Ready hai!","Counter se apna order le lo."],done:["Order complete","Dhanyavaad! Phir aana."],cancelled:["Order cancel ho gaya","Naya order kar sakte ho."]};
function track(id){
$("#menu").style.display="none";$("#bar").style.display="none";$("#status").style.display="block";
onSnapshot(doc(db,"orders",id),s=>{
if(!s.exists()){reset();return}
const d=s.data(),m=MSG[d.status]||["",""];
let x='<div class="card"><div class="stat">'+m[0]+'</div><p>'+m[1]+'</p><p><b>Table '+esc(d.table)+'</b></p>';
d.items.forEach(l=>x+="<div>"+l.q+" × "+esc(l.n)+"</div>");
x+='<p><b>Total: ₹'+d.total+'</b> (counter par pay karo)</p>';
if(d.status==="new")x+='<button class="red" id="cx">Cancel order</button>';
if(d.status==="done"||d.status==="cancelled")x+='<button class="go" style="width:100%;margin-top:12px" id="nw">Naya order</button>';
$("#status").innerHTML=x+"</div>";
const c=$("#cx");if(c)c.onclick=async()=>{if(confirm("Order cancel karna hai?")){try{await updateDoc(doc(db,"orders",id),{status:"cancelled"})}catch(e){alert("Ab cancel nahi ho sakta, kitchen ne start kar diya hai.")}}};
const n=$("#nw");if(n)n.onclick=reset},reset)}
function reset(){localStorage.removeItem("oid");location.reload()}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
await auth.authStateReady();
const oid=localStorage.getItem("oid");if(oid&&auth.currentUser)track(oid);
</script></body></html>
